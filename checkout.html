<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Segundo Tempo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="container">
    <p class="migalhas"><a href="index.html">Início</a> / <a href="carrinho.html">Carrinho</a> / Checkout</p>
    <div class="titulo-pagina"><h1>Finalizar compra</h1></div>

    <div class="duas-colunas">
      <div>
        <div class="etapas" id="etapas">
          <span class="atual">1 · Entrega</span>
          <span>2 · Pagamento</span>
          <span>3 · Revisão</span>
        </div>

        <!-- Etapa 1: dados do cliente e entrega -->
        <section class="bloco etapa ativa" id="etapa1">
          <h2>Seus dados</h2>
          <div class="form-grade">
            <div class="campo largo"><label for="nome">Nome completo</label><input type="text" id="nome"><small></small></div>
            <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" placeholder="000.000.000-00"><small></small></div>
            <div class="campo"><label for="telefone">Telefone</label><input type="text" id="telefone" placeholder="(51) 99999-9999"><small></small></div>
            <div class="campo largo"><label for="email">E-mail</label><input type="text" id="email"><small></small></div>
            <div class="campo"><label for="cep">CEP</label><input type="text" id="cep" placeholder="00000-000"><small></small></div>
            <div class="campo"><label for="numero">Número</label><input type="text" id="numero"><small></small></div>
            <div class="campo largo"><label for="endereco">Endereço</label><input type="text" id="endereco"><small></small></div>
            <div class="campo"><label for="cidade">Cidade</label><input type="text" id="cidade"><small></small></div>
            <div class="campo"><label for="estado">Estado</label>
              <select id="estado">
                <option value="">Selecione</option>
                <option>RS</option><option>SC</option><option>PR</option><option>SP</option><option>RJ</option><option>MG</option><option>Outro</option>
              </select><small></small>
            </div>
          </div>
          <div class="botoes-etapa"><button class="botao" id="ir-pagamento">Continuar para o pagamento</button></div>
        </section>

        <!-- Etapa 2: forma de pagamento -->
        <section class="bloco etapa" id="etapa2">
          <h2>Forma de pagamento</h2>
          <div class="pagamentos" id="pagamentos">
            <label class="pagamento escolhido"><input type="radio" name="pagamento" value="credito" checked><div>Cartão de crédito<small>Parcele sem juros</small></div></label>
            <label class="pagamento"><input type="radio" name="pagamento" value="debito"><div>Cartão de débito<small>Pagamento à vista</small></div></label>
            <label class="pagamento"><input type="radio" name="pagamento" value="pix"><div>Pix<small>5% de desconto no valor dos produtos</small></div></label>
          </div>

          <div class="painel ativo" id="painel-cartao">
            <div class="form-grade">
              <div class="campo largo"><label for="numero-cartao">Número do cartão</label><input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000"><small></small></div>
              <div class="campo largo"><label for="nome-cartao">Nome impresso no cartão</label><input type="text" id="nome-cartao"><small></small></div>
              <div class="campo"><label for="validade">Validade</label><input type="text" id="validade" placeholder="MM/AA"><small></small></div>
              <div class="campo"><label for="cvv">CVV</label><input type="text" id="cvv" placeholder="000"><small></small></div>
              <div class="campo largo" id="campo-parcelas"><label for="parcelas">Parcelas</label><select id="parcelas"></select></div>
            </div>
          </div>

          <div class="painel" id="painel-pix">
            <div class="pix-caixa">
              <p>O QR Code do Pix será exibido ao final da revisão.</p>
            </div>
          </div>

          <div class="botoes-etapa">
            <button class="botao vazado" id="voltar-entrega">Voltar</button>
            <button class="botao" id="ir-revisao">Revisar pedido</button>
          </div>
        </section>

        <!-- Etapa 3: revisão -->
        <section class="bloco etapa" id="etapa3">
          <h2>Revise seu pedido</h2>
          <div class="revisao" id="revisao"></div>
          <div class="painel" id="painel-qr">
            <div class="pix-caixa">
              <img src="img/qrcode-pix.svg" alt="QR Code Pix de demonstração">
              <p><strong>Pague com Pix</strong></p>
              <p>QR Code fictício, apenas para demonstração do projeto.</p>
            </div>
          </div>
          <div class="botoes-etapa">
            <button class="botao vazado" id="voltar-pagamento">Voltar</button>
            <button class="botao lima" id="finalizar">Finalizar pedido</button>
          </div>
        </section>
      </div>

      <aside class="resumo" id="resumo"></aside>
    </div>
  </main>

  <footer id="rodape" class="rodape"></footer>

  <script src="js/dados.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/principal.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
