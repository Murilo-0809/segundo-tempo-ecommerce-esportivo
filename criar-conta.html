<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Segundo Tempo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="container">
    <div class="auth">
      <div class="auth-lado">
        <p class="logo" style="color:var(--lima);font-size:1rem">Crie sua conta</p>
        <h1>Frete grátis na <span>primeira compra.</span></h1>
        <img src="img/bike-rota-c2.jpg" alt="Bike speed Rota C2">
        <ul>
          <li>Compre seminovos com laudo e garantia de 90 dias</li>
          <li>Cadastro rápido, leva menos de 1 minuto</li>
        </ul>
      </div>
      <form class="auth-form" id="form-criar">
        <h2>Criar sua conta</h2>
        <p>Preencha seus dados para comprar e vender no Segundo Tempo.</p>
        <div class="campo"><label for="nome">Nome completo</label><input type="text" id="nome"><small></small></div>
        <div class="bloco-linha">
          <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" placeholder="000.000.000-00"><small></small></div>
          <div class="campo"><label for="celular">Celular</label><input type="text" id="celular" placeholder="(00) 00000-0000"><small></small></div>
        </div>
        <div class="campo"><label for="email">E-mail</label><input type="text" id="email"><small></small></div>
        <div class="campo"><label for="senha">Crie uma senha</label><input type="password" id="senha"><small></small></div>
        <label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="termos"> Li e aceito os Termos de uso e a Política de privacidade</label>
        <button type="submit" class="botao">Criar conta</button>
        <p class="link">Já tem uma conta? <a href="entrar.html">Entrar</a></p>
      </form>
    </div>
  </main>

  <footer id="rodape" class="rodape"></footer>

  <script src="js/dados.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/principal.js"></script>
  <script src="js/criar-conta.js"></script>
</body>
</html>
